name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: read
    # Workflow-level safety net. Cap the whole job at 60 minutes so a
    # hanging test (or a Swift toolchain stall on the GHA runner) fails
    # fast instead of riding the 6h default to cancellation. Locally
    # the suite runs in <10min; 60min gives headroom for FluidAudio
    # (Parakeet) fetch+compile plus the full floor on the macos runner's
    # slower IO.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check monotonic counter collisions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make check-counter-collisions

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Install ripgrep (code_search dependency — CodeEditModule tests require `rg` on PATH)
        run: brew install ripgrep

      - name: Build release
        # Per-step timeout — Swift release build on macos-26 with strict
        # concurrency + FluidAudio (Parakeet) fetch can exceed 25min on GHA;
        # PR #107 reached the final link step before that cap killed it. A 35min
        # cap keeps a bounded failure while allowing a healthy cold build.
        timeout-minutes: 35
        run: make build

      - name: Run test suite + floor gate
        # This step includes a cold debug build before the test binary starts.
        # Give the binary a 15min internal watchdog, then leave the script enough
        # time to retain and print its failure evidence before GitHub's hard kill.
        timeout-minutes: 30
        env:
          TEST_WATCHDOG_SECONDS: "900"
        run: make test-floor
